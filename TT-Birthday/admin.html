<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>治愈日记 - 腾讯云开发司令部</title>
    <!-- 引入腾讯云开发 Web SDK -->
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <style>
        :root {
            --primary: #0052d9; /* 腾讯云蓝 */
            --bg: #f3f6f9;
            --card: #ffffff;
            --text: #1b1f23;
        }
        body { font-family: "PingFang SC", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .card { background: var(--card); border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1, h2 { margin: 0; }
        h2 { font-size: 1.1rem; margin-bottom: 15px; color: #0052d9; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; }
        input, textarea { width: 100%; border: 1px solid #ddd; border-radius: 4px; padding: 10px; font-family: inherit; box-sizing: border-box; margin-bottom: 10px; }
        textarea { height: 120px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        button:hover { background: #003cab; }
        .status-badge { padding: 4px 12px; border-radius: 4px; font-size: 0.8rem; background: #eee; }
        .status-online { background: #e1f3ff; color: #0052d9; border: 1px solid #0052d9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { text-align: left; padding: 12px; background: #f8f9fa; border-bottom: 2px solid #eee; font-size: 0.85rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .refresh-btn { background: #28a745; margin-bottom: 15px; }
        .refresh-btn:hover { background: #218838; }
        
        .setup-guide { background: #fffbe6; border: 1px solid #ffe58f; padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>腾讯云开发控制台</h1>
            <div id="connection-status" class="status-badge">正在连接云环境...</div>
        </div>

        <div class="setup-guide">
            <strong>💡 操作提醒：</strong> 
            请确保已在腾讯云后台：1. 开启<b>匿名登录</b>； 2. 创建集合 <b>AppConfig</b> 和 <b>UserTelemetry</b>； 3. 将当前域名加入<b>安全域名白名单</b>。
        </div>

        <div class="grid">
            <!-- 配置下发 -->
            <div class="card">
                <h2>⚙️ 远程内容控制</h2>
                <label>背景音乐外链 (MP3)</label>
                <input type="text" id="config-bgm" placeholder="不填则使用本地默认音乐">
                
                <label>治愈短语 (每行一句)</label>
                <textarea id="config-phrases" placeholder="输入你想同步到前端的句子..."></textarea>
                
                <button onclick="saveConfig()">确认下发更新</button>
            </div>

            <!-- 数据统计 -->
            <div class="card">
                <h2>📊 核心数据概览</h2>
                <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <div style="flex: 1; background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="color: #666; font-size: 0.85rem;">累计访客</div>
                        <div id="stat-visits" style="font-size: 2rem; font-weight: bold; color: #0052d9;">0</div>
                    </div>
                    <div style="flex: 1; background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="color: #666; font-size: 0.85rem;">收到消息</div>
                        <div id="stat-messages" style="font-size: 2rem; font-weight: bold; color: #28a745;">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详细情报 -->
        <div class="card">
            <h2>📡 实时交互雷达</h2>
            <button class="refresh-btn" onclick="fetchData()">刷新最新情报</button>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>城市 / IP</th>
                            <th>停留时长</th>
                            <th>提交内容</th>
                        </tr>
                    </thead>
                    <tbody id="telemetry-log">
                        <tr><td colspan="4" style="text-align:center;">正在扫描云端...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 你的环境 ID
        const ENV_ID = "tt-7gr2zm0n95f26df2";

        let app = null;
        let db = null;
        let configDocId = null;

        async function initTCB() {
            try {
                app = cloudbase.init({ env: ENV_ID });
                const auth = app.auth({ persistence: "local" });
                
                // 必须开启匿名登录
                if (!auth.hasLoginState()) {
                    await auth.anonymousAuthProvider().signIn();
                }
                
                db = app.database();
                document.getElementById('connection-status').innerText = '已连接：' + ENV_ID;
                document.getElementById('connection-status').classList.add('status-online');
                
                await loadConfig();
                await fetchData();
            } catch (e) {
                console.error(e);
                document.getElementById('connection-status').innerText = '连接失败：' + e.message;
            }
        }

        async function loadConfig() {
            try {
                const res = await db.collection("AppConfig").limit(1).get();
                if (res.data && res.data.length > 0) {
                    const config = res.data[0];
                    configDocId = config._id;
                    document.getElementById('config-bgm').value = config.bgmUrl || '';
                    document.getElementById('config-phrases').value = (config.phrases || []).join('\n');
                }
            } catch (e) {
                console.warn("未找到配置记录，首次保存将自动创建");
            }
        }

        async function saveConfig() {
            const bgmUrl = document.getElementById('config-bgm').value.trim();
            const phrases = document.getElementById('config-phrases').value.split('\n').filter(s => s.trim());
            
            try {
                if (configDocId) {
                    await db.collection("AppConfig").doc(configDocId).update({
                        bgmUrl, phrases, updateTime: db.serverDate()
                    });
                } else {
                    const res = await db.collection("AppConfig").add({
                        bgmUrl, phrases, updateTime: db.serverDate()
                    });
                    configDocId = res.id;
                }
                alert("✨ 同步成功！全部客户端已生效。");
            } catch (e) {
                alert("同步失败：" + e.message);
            }
        }

        async function fetchData() {
            try {
                const res = await db.collection("UserTelemetry").orderBy("createTime", "desc").limit(50).get();
                const tbody = document.getElementById('telemetry-log');
                tbody.innerHTML = '';
                
                let msgCount = 0;
                res.data.forEach(log => {
                    const tr = document.createElement('tr');
                    const content = log.diaryInput || '-';
                    if (content !== '-') msgCount++;
                    
                    const timeStr = log.createTime ? new Date(log.createTime).toLocaleString() : '未知';

                    tr.innerHTML = `
                        <td>${timeStr}</td>
                        <td>${log.cityName || '未知'} <br> <small style="color:#888">${log.ip || '-'}</small></td>
                        <td>${log.durationSec ? log.durationSec + '秒' : '浏览中'}</td>
                        <td style="max-width:400px; word-break:break-all">${content}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('stat-visits').innerText = res.data.length;
                document.getElementById('stat-messages').innerText = msgCount;
            } catch (e) {
                console.error(e);
            }
        }

        initTCB();
    </script>
</body>
</html>
