<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>治愈日记</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            /* 修改为 dvh (动态视口高度)，彻底解决苹果设备 Safari 底部控制栏挤压画面位置的问题 */
            height: 100dvh;
            overflow: hidden;
            background-color: #050914;
            /* 兜底深空背景色 */
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            touch-action: none;
            /* 禁用系统滚动 */
        }

        /* 统一缩放扩大一点点，避免由于设备旋转位移和海浪动画导致露边 */
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            transform: scale(1.1);
            transform-origin: center center;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            /* 让上层点击穿透到底层组件 */
            transform: translateZ(0);
            /* 开启硬件渲染加速，避免页面重绘卡顿 */
        }

        /* 第一部分：各层级与Z-Index设定 */
        #sky {
            z-index: 1;
        }

        /* 避免因为背景为黑白，直接平滑展示画面 */
        #scene,
        #ui-layer {
            opacity: 1;
        }

        /* 启动授权遮罩（解决 iOS13+ 苹果必须点击才能给陀螺仪权限的痛点） */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 9, 20, 0.95);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            transition: opacity 0.8s ease;
        }

        #start-btn {
            padding: 15px 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* 独立闪烁的星星层 */
        #star {
            z-index: 2;
            animation: twinkle 3s infinite alternate;
        }

        #star1 {
            z-index: 3;
            animation: twinkle 4s infinite alternate -1s;
        }

        #star2 {
            z-index: 4;
            animation: twinkle 5s infinite alternate -2s;
        }

        #star3 {
            z-index: 5;
            animation: twinkle 2.5s infinite alternate -1.5s;
        }

        #star4 {
            z-index: 6;
            animation: twinkle 3.5s infinite alternate -0.5s;
        }

        /* 月落月起（完整周期10分钟=600秒）*/
        #moon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 50% 120%;
            /* 以屏幕底部偏下为圆心 */
            /* 加入 -300s 的提前量，即页面加载时动画仿佛已经执行了5分钟（直接位于圆弧顶点），月亮即可开屏见 */
            animation: moonOrbit 600s infinite linear -300s;
        }

        #moon-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 恢复为发光的光晕，放弃透明度闪烁 */
            animation: moonBreath 6s infinite alternate ease-in-out;
            will-change: filter;
            /* 尽量优化发光的性能消耗 */
        }

        /* 海浪交错运动：往复滑动 */
        #ocean4 {
            z-index: 8;
            animation: waveLeftRight 18s infinite ease-in-out alternate;
        }

        #dao {
            z-index: 9;
        }

        #ocean3 {
            z-index: 10;
            animation: waveRightLeft 15s infinite ease-in-out alternate;
        }

        #ocean2 {
            z-index: 11;
            animation: waveLeftRight 13s infinite ease-in-out alternate;
        }

        #ocean1 {
            z-index: 12;
            animation: waveRightLeft 10s infinite ease-in-out alternate;
        }

        /* UI前景背景层 */
        #heying-container {
            z-index: 13;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #heying {
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #heying1 {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* UI逻辑层 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .clickable {
            pointer-events: auto;
        }

        /* 治愈文字容器 */
        #healing-text {
            position: absolute;
            top: 22%;
            /* 位于星空/月亮区域 */
            width: 80%;
            left: 10%;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            font-size: 1.15rem;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            line-height: 1.6;
        }

        /* 历史记录按钮（蜡笔手绘风格） */
        #history-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 2px solid;
            /* 模拟手绘随意边框：利用 border-radius 的不规则性 */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }

        #history-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* 文本框与发送区域 */
        #input-container {
            position: absolute;

            /* 👇👇 【这里改常规状态下（heying）的位置】 👇👇：数字越小越靠下 */
            bottom: 4dvh;

            left: 50%;
            transform: translateX(-50%);

            /* 👇👇 【这里改宽度】 👇👇：数值越小越窄，以便塞进 heying 画好的框里 */
            width: 65%;
            max-width: 500px;

            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
            transition: bottom 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 👇👇 【这里改展开状态下（heying1）的位置】 👇👇：当点击输入框 heying1 浮现时，文本框框应该上移对齐弹出的背景 */
        #input-container:focus-within {
            bottom: 18dvh;
        }

        #diary-input {
            width: 100%;
            min-height: 48px;
            height: 48px;
            background: transparent !important;
            /* 强制完全透明，因为完全复用你画好的 heying */
            border: none !important;
            padding: 12px 15px;
            color: #222 !important;
            /* 深色字体，强行覆盖避免看不清 */
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.4;
            box-sizing: border-box;
            resize: none;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #diary-input:focus {
            height: 180px;
            background: transparent !important;
            /* 聚焦时也透明，使得背后 heying1 成为实际载体 */
            outline: none;
        }

        #diary-input::placeholder {
            color: rgba(0, 0, 0, 0.45);
            /* 黑灰色的提示语 */
        }

        #send-btn {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.4) !important;
            color: #222 !important;
            /* 强行改为黑色字体！ */
            font-weight: bold;
            /* 加粗让你看得清清楚楚 */
            border: 1px solid rgba(0, 0, 0, 0.2) !important;
            /* 换成黑框增加识别度 */
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            /* 不可见时不可点 */
        }

        /* 当输入框聚焦或者处于活跃状态时显示发送按钮 */
        #diary-input:focus~#send-btn,
        #send-btn.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #send-btn:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        /* ==== 历史记录弹窗面板临时样式 ==== */
        #history-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 5000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .history-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            height: 60%;
            padding: 20px;
            color: #333;
            position: relative;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
        }

        #close-history {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #555;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
        }

        #history-list {
            margin-top: 20px;
            color: #666;
            font-size: 0.95rem;
        }


        /* --- 动画关键帧 --- */

        /* 星星闪烁 */
        @keyframes twinkle {
            0% {
                opacity: 0.2;
            }

            40% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }

        /* 海浪交错动画，使用 translate3d 开启 GPU 加速避免卡顿 */
        @keyframes waveLeftRight {
            0% {
                transform: translate3d(-1.5%, 0, 0);
            }

            100% {
                transform: translate3d(1.5%, 0, 0);
            }
        }

        @keyframes waveRightLeft {
            0% {
                transform: translate3d(1.5%, 0, 0);
            }

            100% {
                transform: translate3d(-1.5%, 0, 0);
            }
        }

        /* 月亮圆弧轨道及落起 */
        @keyframes moonOrbit {
            0% {
                transform: rotate(-80deg) translateZ(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform: rotate(0deg) translateZ(0);
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: rotate(80deg) translateZ(0);
                opacity: 0;
            }
        }

        /* 月亮本身光晕增强 */
        @keyframes moonBreath {
            0% {
                filter: drop-shadow(0 0 5px rgba(255, 255, 220, 0.3));
                opacity: 1;
            }

            100% {
                filter: drop-shadow(0 0 35px rgba(255, 255, 255, 1));
                opacity: 1;
            }
        }

        /* 发送动画特效的星星粒子 */
        .particle {
            position: absolute;
            color: #FFD700;
            font-size: 24px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 8px #FFD700, 0 0 15px rgba(255, 215, 0, 0.8);
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1), opacity 2s ease-in;
        }
    </style>
</head>

<body>

    <!-- 苹果 iOS 专属陀螺仪授权开屏按钮 -->
    <div id="start-overlay">
        <div id="start-btn">点击开启流星星空</div>
    </div>

    <!-- 视角容器 -->
    <div id="scene">
        <!-- 第 1-13 层 Z-index -->
        <img src="sky.png" id="sky" class="layer parallax-layer" alt="天空">

        <img src="star.png" id="star" class="layer parallax-layer" alt="星星">
        <img src="star1.png" id="star1" class="layer parallax-layer" alt="星星1">
        <img src="star2.png" id="star2" class="layer parallax-layer" alt="星星2">
        <img src="star3.png" id="star3" class="layer parallax-layer" alt="星星3">
        <img src="star4.png" id="star4" class="layer parallax-layer" alt="星星4">

        <!-- 将月亮分离为一个接收视差的 wrapper 层，与内部处理转动的 container 层分离，避免 transform 行内样式覆盖丢失动画 -->
        <div id="moon-wrapper" class="layer parallax-layer" style="z-index: 7;">
            <div id="moon-container">
                <img src="moon.png" alt="月亮">
            </div>
        </div>

        <img src="ocean4.png" id="ocean4" class="layer parallax-layer" alt="海浪4">
        <img src="dao.png" id="dao" class="layer parallax-layer" alt="岛屿">
        <img src="ocean3.png" id="ocean3" class="layer parallax-layer" alt="海浪3">
        <img src="ocean2.png" id="ocean2" class="layer parallax-layer" alt="海浪2">
        <img src="ocean1.png" id="ocean1" class="layer parallax-layer" alt="最近海浪">

        <!-- 前景 UI 系列 -->
        <div id="heying-container" class="parallax-layer">
            <img src="heying.png" id="heying" class="layer" alt="常规底背">
            <img src="heying1.png" id="heying1" class="layer" alt="展开时底背">
        </div>
    </div>

    <!-- 最高层级UI层互动 -->
    <div id="ui-layer">
        <!-- 历史小按钮 -->
        <button id="history-btn" class="clickable">时光印记</button>

        <!-- 治愈系短语 -->
        <div id="healing-text"></div>

        <!-- 输入区域 -->
        <div id="input-container">
            <textarea id="diary-input" class="clickable" placeholder="写下今天的故事..."></textarea>
            <button id="send-btn" class="clickable">放飞心情</button>
        </div>
    </div>

    <!-- 历史记录展示弹窗 (默认隐藏) -->
    <div id="history-modal" style="display: none;">
        <div class="history-content clickable">
            <button id="close-history">关闭</button>
            <h3 style="margin-top:0;">往期回忆</h3>
            <div id="history-list">
                <p>这里目前空空如也。</p>
                <p>等到接通后端邮箱或数据库后，别人写下的日记都会奇迹般地保存在这里！</p>
            </div>
        </div>
    </div>

    <script>
        // 1. 治愈暖心短语系统 (10s 循环切换)
        const phrases = [
            "所有的星星都会为你闪烁。",
            "即使是最微弱的光，也能带来希望的余温。",
            "晚风正在收集你今天的所有不开心。",
            "总有一片海，会接纳你的所有情绪。",
            "闭上眼，听海浪替你诉说心事。",
            "在这个世界上，你永远是某人眼里的漫天星光。",
            "允许自己偶尔脆弱，今夜就在这里安歇吧。",
            "每一刻的平静，都是生活给予的最温柔的拥抱。"
        ];

        const textEl = document.getElementById('healing-text');
        function cycleText() {
            textEl.style.opacity = '0';
            setTimeout(() => {
                const randText = phrases[Math.floor(Math.random() * phrases.length)];
                textEl.innerText = randText;
                textEl.style.opacity = '1';
            }, 1600); // 等待淡出后再修改文本
        }

        cycleText(); // 初始化第一条
        setInterval(cycleText, 10000); // 每10秒抽取一次并渐入渐出

        // 2. 深度动效系统：陀螺仪反向深度视差
        // 核心理念：前景正向跑，海洋/星空/月亮【反向】偏移，用负数权重，产生极强烈的交叉层级裸眼 3D 感应！
        const parallaxConfig = [
            { id: 'heying-container', weight: 1.0 },   // 焦点前景
            { id: 'dao', weight: 0.4 },                // 中岛，跟进小幅度正向

            { id: 'ocean1', weight: -0.1 },            // 注意！从这里开始海浪背景向反方向负位移
            { id: 'ocean2', weight: -0.15 },
            { id: 'ocean3', weight: -0.2 },
            { id: 'ocean4', weight: -0.25 },
            { id: 'moon-wrapper', weight: -0.3 },      // 月宫深距反向
            { id: 'sky', weight: 0 }                   // 星空幕布深处不动
        ];

        // 让星星进行随机小幅度反向游走位移，增加生机
        ['star', 'star1', 'star2', 'star3', 'star4'].forEach(id => {
            parallaxConfig.push({ id, weight: Math.random() * -0.2 - 0.1 });
        });

        // 获取元素DOM引用
        const parallaxElements = parallaxConfig.map(item => ({
            el: document.getElementById(item.id),
            weight: item.weight
        })).filter(o => o.el);

        // 渲染插值，使动画极其平滑
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        const maxOffsetPx = 20; // weight为1.0时的最大偏移量

        function updateParallax() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            parallaxElements.forEach(item => {
                const x = currentX * maxOffsetPx * item.weight;
                const y = currentY * maxOffsetPx * item.weight;
                // 使用 translate3d 开启强制硬件加速，避免掉帧卡顿
                item.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            });

            requestAnimationFrame(updateParallax);
        }
        requestAnimationFrame(updateParallax);

        // 苹果 iOS 13+ 终极对策：必须由用户屏幕点击才能获取陀螺仪！
        const startOverlay = document.getElementById('start-overlay');

        startOverlay.addEventListener('click', () => {
            // 消失遮罩
            startOverlay.style.opacity = '0';
            setTimeout(() => startOverlay.remove(), 800);

            // 请求陀螺仪权限 (iOS 13+ 专用)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert("已拒接开启陀螺仪，只能滑动体验视差啦");
                        }
                    })
                    .catch(console.error);
            } else {
                // 安卓或旧设备直接挂载
                window.addEventListener('deviceorientation', handleOrientation);
            }
        });

        // 抽离出来的陀螺仪解析函数
        function handleOrientation(e) {
            if (e.beta !== null && e.gamma !== null) {
                let x = Math.max(-1, Math.min(1, e.gamma / 45));
                let y = Math.max(-1, Math.min(1, (e.beta - 45) / 45));
                targetX = x;
                targetY = y;
            }
        }

        // 为兼容桌面调试，同时加上鼠标移动监听。
        // 修正为 pointermove 且排除了手指触摸事件，避免手机屏幕点击导致画面异常跳闪
        window.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'mouse') return; // 手机端不再受手指点击干扰
            let x = (e.clientX / window.innerWidth) * 2 - 1;
            let y = (e.clientY / window.innerHeight) * 2 - 1;
            targetX = x;
            targetY = y;
        });


        // 3. UI 交互逻辑：文本框状态与特效
        const diaryInput = document.getElementById('diary-input');
        const sendBtn = document.getElementById('send-btn');
        const heying = document.getElementById('heying');
        const heying1 = document.getElementById('heying1');

        // 点击/获取焦点：切换heying1长文本模式
        diaryInput.addEventListener('focus', () => {
            heying.style.opacity = '0';
            heying1.style.opacity = '1';
        });

        // 离开焦点还原（如果输入框为空）
        diaryInput.addEventListener('blur', () => {
            if (!diaryInput.value.trim()) {
                heying.style.opacity = '1';
                heying1.style.opacity = '0';
            }
            // 延迟一点以确保按钮点击生效
            setTimeout(() => {
                if (document.activeElement !== diaryInput) {
                    sendBtn.classList.remove('active');
                }
            }, 150);
        });

        diaryInput.addEventListener('input', () => {
            if (diaryInput.value.trim()) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        });


        // 4. 发送微型金色星星粒子特效与记录保存
        sendBtn.addEventListener('click', () => {
            if (!diaryInput.value.trim()) return;

            // ================= 新增：将个人历史记录写进用户自己的手机缓存 =================
            const diaryText = diaryInput.value.trim();
            const dateStr = new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            // 从本地加载过往记录
            let records = JSON.parse(localStorage.getItem('tt-diary-history') || '[]');
            // 把新的日记插到最前面
            records.unshift({ time: dateStr, text: diaryText });
            // 保存回手机本地
            localStorage.setItem('tt-diary-history', JSON.stringify(records));
            // ==========================================================================

            // 获取输入框的中心顶部坐标作为发射点
            const rect = diaryInput.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top;

            // 清空、失焦、还原UI
            diaryInput.value = '';
            sendBtn.classList.remove('active');
            heying.style.opacity = '1';
            heying1.style.opacity = '0';
            diaryInput.blur();

            // 生成粒子抛物线飞空
            createParticle(startX, startY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = '✨';

            // 初始位置设定
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.getElementById('ui-layer').appendChild(particle);

            // 必须在下一帧应用位移以触发过渡动画 (抛物线通过贝塞尔曲线和位移实现)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    // 朝向高空深处飞去 (正中心偏上方位置)
                    const targetX = window.innerWidth / 2 - x;
                    const targetY = -(y - window.innerHeight * 0.2);

                    particle.style.transform = `translate(${targetX}px, ${targetY}px) scale(0.3)`;
                    particle.style.opacity = '0'; // 随之消失
                });
            });

            // 回收DOM
            setTimeout(() => {
                particle.remove();
            }, 2000);
        }

        // 5. 历史记录弹窗交互 (读取本地记录)
        const historyBtn = document.getElementById('history-btn');
        const historyModal = document.getElementById('history-modal');
        const closeHistoryBtn = document.getElementById('close-history');
        const historyList = document.getElementById('history-list');

        historyBtn.addEventListener('click', () => {
            // 打开时，读取本地保存的个人日记
            let records = JSON.parse(localStorage.getItem('tt-diary-history') || '[]');

            if (records.length === 0) {
                historyList.innerHTML = '<p style="color:#666;">你还没有写下过日记哦，快去放飞今天的心情吧。</p>';
            } else {
                historyList.innerHTML = records.map(r => `
                    <div style="background: rgba(255,255,255,0.6); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.1); text-align: left;">
                        <div style="font-size: 0.8rem; color: #888; margin-bottom: 6px;">${r.time}</div>
                        <div style="color: #222; font-size: 1rem; line-height: 1.4; word-break: break-all;">${r.text}</div>
                    </div>
                `).join('');
            }
            historyModal.style.display = 'flex';
        });

        closeHistoryBtn.addEventListener('click', () => {
            historyModal.style.display = 'none';
        });

    </script>
</body>
