<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>治愈日记</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050914; /* 兜底深空背景色 */
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            touch-action: none; /* 禁用系统滚动 */
        }

        /* 统一缩放扩大一点点，避免由于设备旋转位移和海浪动画导致露边 */
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            transform: scale(1.1);
            transform-origin: center center;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* 让上层点击穿透到底层组件 */
            transform: translateZ(0); /* 开启硬件渲染加速，避免页面重绘卡顿 */
        }

        /* 第一部分：各层级与Z-Index设定 */
        #sky { z-index: 1; }
        
        /* 避免因为背景为黑白，直接平滑展示画面 */
        #scene, #ui-layer { opacity: 1; }
        
        /* 独立闪烁的星星层 */
        #star { z-index: 2; animation: twinkle 3s infinite alternate; }
        #star1 { z-index: 3; animation: twinkle 4s infinite alternate -1s; }
        #star2 { z-index: 4; animation: twinkle 5s infinite alternate -2s; }
        #star3 { z-index: 5; animation: twinkle 2.5s infinite alternate -1.5s; }
        #star4 { z-index: 6; animation: twinkle 3.5s infinite alternate -0.5s; }
        
        /* 月落月起（完整周期10分钟=600秒）*/
        #moon-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            transform-origin: 50% 120%; /* 以屏幕底部偏下为圆心 */
            /* 加入 -300s 的提前量，即页面加载时动画仿佛已经执行了5分钟（直接位于圆弧顶点），月亮即可开屏见 */
            animation: moonOrbit 600s infinite linear -300s; 
        }
        #moon-container img {
            width: 100%; height: 100%; object-fit: cover;
            /* 摒弃极度消耗性能的全屏 drop-shadow 滤镜，改用轻量的透明度呼吸 */
            animation: moonBreath 6s infinite alternate ease-in-out; 
        }

        /* 海浪交错运动：往复滑动 */
        #ocean4 { z-index: 8; animation: waveLeftRight 18s infinite ease-in-out alternate; }
        #dao { z-index: 9; }
        #ocean3 { z-index: 10; animation: waveRightLeft 15s infinite ease-in-out alternate; }
        #ocean2 { z-index: 11; animation: waveLeftRight 13s infinite ease-in-out alternate; }
        #ocean1 { z-index: 12; animation: waveRightLeft 10s infinite ease-in-out alternate; }
        
        /* UI前景背景层 */
        #heying-container {
            z-index: 13;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        #heying { opacity: 1; transition: opacity 0.5s ease; }
        #heying1 { opacity: 0; transition: opacity 0.5s ease; }

        /* UI逻辑层 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; 
        }

        .clickable {
            pointer-events: auto;
        }

        /* 治愈文字容器 */
        #healing-text {
            position: absolute;
            top: 22%; /* 位于星空/月亮区域 */
            width: 80%;
            left: 10%;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            font-size: 1.15rem;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            line-height: 1.6;
        }

        /* 历史记录按钮（蜡笔手绘风格） */
        #history-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 2px solid;
            /* 模拟手绘随意边框：利用 border-radius 的不规则性 */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(255,255,255,0.2);
        }
        #history-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* 文本框与发送区域 */
        #input-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        #diary-input {
            width: 100%;
            min-height: 48px; /* 约等于两行高度 */
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            line-height: 1.4;
            box-sizing: border-box;
            resize: none;
            backdrop-filter: blur(8px);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #diary-input:focus {
            height: 180px; /* 展开模式厚度增加 */
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            border-color: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
        }

        #diary-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #send-btn {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none; /* 不可见时不可点 */
        }

        /* 当输入框聚焦或者处于活跃状态时显示发送按钮 */
        #diary-input:focus ~ #send-btn, #send-btn.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #send-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* --- 动画关键帧 --- */

        /* 星星闪烁 */
        @keyframes twinkle {
            0% { opacity: 0.2; }
            40% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* 海浪交错动画，使用 translate3d 开启 GPU 加速避免卡顿 */
        @keyframes waveLeftRight {
            0% { transform: translate3d(-1.5%, 0, 0); }
            100% { transform: translate3d(1.5%, 0, 0); }
        }
        @keyframes waveRightLeft {
            0% { transform: translate3d(1.5%, 0, 0); }
            100% { transform: translate3d(-1.5%, 0, 0); }
        }

        /* 月亮圆弧轨道及落起 */
        @keyframes moonOrbit {
            0% { transform: rotate(-80deg) translateZ(0); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: rotate(0deg) translateZ(0); opacity: 1; }
            90% { opacity: 1; }
            100% { transform: rotate(80deg) translateZ(0); opacity: 0; }
        }
        
        /* 月亮本身呼吸感增强（使用 opacity 极致优化性能） */
        @keyframes moonBreath {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* 发送动画特效的星星粒子 */
        .particle {
            position: absolute;
            color: #FFD700;
            font-size: 24px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 8px #FFD700, 0 0 15px rgba(255, 215, 0, 0.8);
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1), opacity 2s ease-in;
        }
    </style>
</head>
<body>

    <!-- 视角容器 -->
    <div id="scene">
        <!-- 第 1-13 层 Z-index -->
        <img src="sky.png" id="sky" class="layer parallax-layer" alt="天空">
        
        <img src="star.png" id="star" class="layer parallax-layer" alt="星星">
        <img src="star1.png" id="star1" class="layer parallax-layer" alt="星星1">
        <img src="star2.png" id="star2" class="layer parallax-layer" alt="星星2">
        <img src="star3.png" id="star3" class="layer parallax-layer" alt="星星3">
        <img src="star4.png" id="star4" class="layer parallax-layer" alt="星星4">
        
        <!-- 将月亮分离为一个接收视差的 wrapper 层，与内部处理转动的 container 层分离，避免 transform 行内样式覆盖丢失动画 -->
        <div id="moon-wrapper" class="layer parallax-layer" style="z-index: 7;">
            <div id="moon-container">
                <img src="moon.png" alt="月亮">
            </div>
        </div>
        
        <img src="ocean4.png" id="ocean4" class="layer parallax-layer" alt="海浪4">
        <img src="dao.png" id="dao" class="layer parallax-layer" alt="岛屿">
        <img src="ocean3.png" id="ocean3" class="layer parallax-layer" alt="海浪3">
        <img src="ocean2.png" id="ocean2" class="layer parallax-layer" alt="海浪2">
        <img src="ocean1.png" id="ocean1" class="layer parallax-layer" alt="最近海浪">

        <!-- 前景 UI 系列 -->
        <div id="heying-container" class="parallax-layer">
            <img src="heying.png" id="heying" class="layer" alt="常规底背">
            <img src="heying1.png" id="heying1" class="layer" alt="展开时底背">
        </div>
    </div>

    <!-- 最高层级UI层互动 -->
    <div id="ui-layer">
        <!-- 历史小按钮 -->
        <button id="history-btn" class="clickable">时光印记</button>

        <!-- 治愈系短语 -->
        <div id="healing-text"></div>

        <!-- 输入区域 -->
        <div id="input-container">
            <textarea id="diary-input" class="clickable" placeholder="写下今天的故事..."></textarea>
            <button id="send-btn" class="clickable">放飞心情</button>
        </div>
    </div>

    <script>
        // 1. 治愈暖心短语系统 (10s 循环切换)
        const phrases = [
            "所有的星星都会为你闪烁。",
            "即使是最微弱的光，也能带来希望的余温。",
            "晚风正在收集你今天的所有不开心。",
            "总有一片海，会接纳你的所有情绪。",
            "闭上眼，听海浪替你诉说心事。",
            "在这个世界上，你永远是某人眼里的漫天星光。",
            "允许自己偶尔脆弱，今夜就在这里安歇吧。",
            "每一刻的平静，都是生活给予的最温柔的拥抱。"
        ];

        const textEl = document.getElementById('healing-text');
        function cycleText() {
            textEl.style.opacity = '0';
            setTimeout(() => {
                const randText = phrases[Math.floor(Math.random() * phrases.length)];
                textEl.innerText = randText;
                textEl.style.opacity = '1';
            }, 1600); // 等待淡出后再修改文本
        }
        
        cycleText(); // 初始化第一条
        setInterval(cycleText, 10000); // 每10秒抽取一次并渐入渐出

        // 2. 深度动效系统：陀螺仪视差与位移权重
        // 权重分配：heying (1.0) > dao (0.6) > ocean (0.4-0.2) > moon (0.1) > sky (0)
        const parallaxConfig = [
            { id: 'heying-container', weight: 1.0 },
            { id: 'dao', weight: 0.6 },
            { id: 'ocean1', weight: 0.4 },
            { id: 'ocean2', weight: 0.35 }, // 递减渐变
            { id: 'ocean3', weight: 0.3 },
            { id: 'ocean4', weight: 0.2 },
            { id: 'moon-wrapper', weight: 0.1 },
            { id: 'sky', weight: 0 }
        ];

        // 增加些许星星视差
        ['star', 'star1', 'star2', 'star3', 'star4'].forEach(id => {
            parallaxConfig.push({ id, weight: 0.05 });
        });

        // 获取元素DOM引用
        const parallaxElements = parallaxConfig.map(item => ({
            el: document.getElementById(item.id),
            weight: item.weight
        })).filter(o => o.el);

        // 渲染插值，使动画极其平滑
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        const maxOffsetPx = 20; // weight为1.0时的最大偏移量

        function updateParallax() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            parallaxElements.forEach(item => {
                const x = currentX * maxOffsetPx * item.weight;
                const y = currentY * maxOffsetPx * item.weight;
                // 使用 translate3d 开启强制硬件加速，避免掉帧卡顿
                item.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            });

            requestAnimationFrame(updateParallax);
        }
        requestAnimationFrame(updateParallax);

        // 监听设备倾斜 (陀螺仪)
        window.addEventListener('deviceorientation', (e) => {
            if (e.beta !== null && e.gamma !== null) {
                // gamma 代表左右翻转，beta 代表前后翻转
                // 限制取值映射到 [-1, 1] 区间范围内
                let x = Math.max(-1, Math.min(1, e.gamma / 45)); 
                let y = Math.max(-1, Math.min(1, (e.beta - 45) / 45)); // 补偿45度的基准手持角
                targetX = x;
                targetY = y;
            }
        });

        // 为兼容桌面调试，同时加上鼠标移动监听。
        // 修正为 pointermove 且排除了手指触摸事件，避免手机屏幕点击导致画面异常跳闪
        window.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'mouse') return; // 手机端不再受手指点击干扰
            let x = (e.clientX / window.innerWidth) * 2 - 1;
            let y = (e.clientY / window.innerHeight) * 2 - 1;
            targetX = x;
            targetY = y;
        });


        // 3. UI 交互逻辑：文本框状态与特效
        const diaryInput = document.getElementById('diary-input');
        const sendBtn = document.getElementById('send-btn');
        const heying = document.getElementById('heying');
        const heying1 = document.getElementById('heying1');

        // 点击/获取焦点：切换heying1长文本模式
        diaryInput.addEventListener('focus', () => {
            heying.style.opacity = '0';
            heying1.style.opacity = '1';
        });

        // 离开焦点还原（如果输入框为空）
        diaryInput.addEventListener('blur', () => {
            if (!diaryInput.value.trim()) {
                heying.style.opacity = '1';
                heying1.style.opacity = '0';
            }
            // 延迟一点以确保按钮点击生效
            setTimeout(() => {
                if(document.activeElement !== diaryInput) {
                    sendBtn.classList.remove('active');
                }
            }, 150);
        });

        diaryInput.addEventListener('input', () => {
            if (diaryInput.value.trim()) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        });


        // 4. 发送微型金色星星粒子特效
        sendBtn.addEventListener('click', () => {
            if(!diaryInput.value.trim()) return;

            // 获取输入框的中心顶部坐标作为发射点
            const rect = diaryInput.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top;

            // 清空、失焦、还原UI
            diaryInput.value = '';
            sendBtn.classList.remove('active');
            heying.style.opacity = '1';
            heying1.style.opacity = '0';
            diaryInput.blur();

            // 生成粒子抛物线飞空
            createParticle(startX, startY);
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = '✨';
            
            // 初始位置设定
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            document.getElementById('ui-layer').appendChild(particle);

            // 必须在下一帧应用位移以触发过渡动画 (抛物线通过贝塞尔曲线和位移实现)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    // 朝向高空深处飞去 (正中心偏上方位置)
                    const targetX = window.innerWidth / 2 - x;
                    const targetY = -(y - window.innerHeight * 0.2); 
                    
                    particle.style.transform = `translate(${targetX}px, ${targetY}px) scale(0.3)`;
                    particle.style.opacity = '0'; // 随之消失
                });
            });

            // 回收DOM
            setTimeout(() => {
                particle.remove();
            }, 2000);
        }

        // 历史按钮交互
        document.getElementById('history-btn').addEventListener('click', () => {
            // 在此可弹出历史日记列表的预留入口。此处以弹窗演示
            alert("即将打开往期回忆...");
        });

    </script>
</body>
</html>
