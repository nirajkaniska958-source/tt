<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>治愈日记</title>
    <!-- 引入腾讯云开发 Web SDK (云端记忆盘) -->
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script src="https://pv.sohu.com/cityjson?ie=utf-8"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            /* 👇 必须加上100vh兜底旧版安卓内核！它们不认识下方的 dvh 导致整个高度变为0从而黑屏 */
            height: 100vh;
            /* 修改为 dvh (动态视口高度)，彻底解决苹果设备 Safari 底部控制栏挤压画面位置的问题 */
            height: 100dvh;
            overflow: hidden;
            background-color: #050914;
            /* 兜底深空背景色 */
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            touch-action: manipulation;
            /* 采用 manipulation 全面禁用双击放大，彻底解决双击缩不回去的死局 */
            -webkit-text-size-adjust: 100%;
        }

        /* 统一缩放扩大一点点，避免由于设备旋转位移和海浪动画导致露边 */
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            transform: scale(1.1);
            transform-origin: center center;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            /* 让上层点击穿透到底层组件 */
            transform: translateZ(0);
            /* 开启硬件渲染加速，避免页面重绘卡顿 */
        }

        /* 第一部分：各层级与Z-Index设定 */
        #sky {
            z-index: 1;
        }

        /* 避免因为背景为黑白，直接平滑展示画面 */
        #scene,
        #ui-layer {
            opacity: 1;
        }

        /* 启动授权遮罩（解决 iOS13+ 苹果必须点击才能给陀螺仪权限的痛点） */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 9, 20, 0.95);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            transition: opacity 0.8s ease;
        }

        #start-btn {
            padding: 15px 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            font-size: 1.1rem;
            letter-spacing: 2px;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* 独立闪烁的星星层 */
        #star {
            z-index: 2;
            animation: twinkle 3s infinite alternate;
        }

        #star1 {
            z-index: 3;
            animation: twinkle 4s infinite alternate -1s;
        }

        #star2 {
            z-index: 4;
            animation: twinkle 5s infinite alternate -2s;
        }

        #star3 {
            z-index: 5;
            animation: twinkle 2.5s infinite alternate -1.5s;
        }

        #star4 {
            z-index: 6;
            animation: twinkle 3.5s infinite alternate -0.5s;
        }

        /* 月亮轨道由 JavaScript 精确控制，不再使用 CSS animation */
        #moon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 50% 120%;
            will-change: transform, opacity;
        }

        #moon-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 恢复为发光的光晕，放弃透明度闪烁 */
            animation: moonBreath 6s infinite alternate ease-in-out;
            will-change: filter;
            /* 尽量优化发光的性能消耗 */
        }

        /* 👇👇 【海浪流动速度调整】 👇👇：修改 18s/15s。数字越小水流越快！ */
        #ocean4 {
            z-index: 8;
            animation: waveLeftRight 7s infinite ease-in-out alternate;
        }

        #dao {
            z-index: 9;
        }

        #ocean3 {
            z-index: 10;
            animation: waveRightLeft 5s infinite ease-in-out alternate;
        }

        #ocean2 {
            z-index: 11;
            animation: waveLeftRight 8s infinite ease-in-out alternate;
        }

        #ocean1 {
            z-index: 12;
            animation: waveRightLeft 6s infinite ease-in-out alternate;
        }

        /* UI前景背景层 */
        #heying-container {
            z-index: 13;
            position: absolute;

            /* 👇👇 【听你的：把 heying 往下微调一点】 👇👇 */
            /* 填入正数就会往下走，比如 5vh 根据你的观感可以改成 3vh 或者 8vh！ */
            top: 5vh;
            top: 5dvh;

            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #heying {
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #heying1 {
            opacity: 0;
            transition: opacity 0.5s ease;
        }



        /* UI逻辑层 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .clickable {
            pointer-events: auto;
        }

        /* 治愈文字容器 */
        #healing-text {
            position: absolute;
            top: 22%;
            /* 位于星空/月亮区域 */
            width: 80%;
            left: 10%;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);

            /* 修改为深色强力黑底阴影，保证文字即便重叠在极亮的偏白色月亮上，也如刀刻般清晰！ */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.6);

            font-size: 1.15rem;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            line-height: 1.6;
        }

        /* 历史记录按钮（蜡笔手绘风格） */
        #history-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 2px solid;
            /* 模拟手绘随意边框：利用 border-radius 的不规则性 */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }

        #history-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* 音乐控制按钮 */
        #music-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        #music-btn.playing {
            animation: spinMusic 4s linear infinite;
        }

        @keyframes spinMusic {
            100% { transform: rotate(360deg); }
        }

        /* 👇👇 【海洋位置的独立悬浮文本框】 👇👇 */
        #input-container {
            position: absolute;
            bottom: 12vh;
            bottom: 12dvh;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
            transition: bottom 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 键盘弹出时的常规避让 */
        #input-container.expanded {
            /* 👇👇 【这里调整整个大纸张框的位置】 👇👇：
               既然你要往下延展，我们就把它的底部基准线狠狠往下拉！
               把 bottom 从原本的 18 改到了 4，这意味着底部的“放飞心情”按钮和整个框都会大幅下降！ */
            bottom: 4vh;
            bottom: 4dvh;
        }

        #diary-input {
            width: 100%;
            /* 还原为你最满意的 48px 纤细胶囊高度 */
            min-height: 48px;
            height: 48px;

            /* 极简高级风：若有若无的一条极细发光描边线和完全干净的背景 */
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: none;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 25px;

            /* 核心破案点：把原本 12px 的上下内边距压缩到 4px！给两行文字腾出绝对的空间！ */
            padding: 4px 20px;
            color: #000000 !important;
            text-shadow: none;
            text-align: center;
            font-size: 1rem;
            line-height: normal;
            box-sizing: border-box;
            outline: none;
            resize: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            /* 极轻隐形投影 */
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #input-container.expanded #diary-input {
            /* 👇👇 【在这个位置修改 heying1 展开后的巨大文本框高度】 👇👇：
               既然现在底部被拉下去了，这里的 40vh 就会往下生长，从而完美铺满纸张的中下部，再也不会跑到脸上去了！ */
            height: 40vh;
            /* 👇👇 【全面还原展开状态的透明逻辑】 👇👇 */
            /* 展开时全部变回完全透明，好重叠贴合 heying1 画出的框子 */
            background: transparent !important;
            border: none !important;
            border-radius: 0;
            box-shadow: none;
            color: #000000 !important;
            /* 保持黑字 */
            text-align: left !important;
            /* 展开后变回向左对齐 */
            text-shadow: none !important;
        }

        #diary-input::placeholder {
            color: rgba(0, 0, 0, 0.5);
            text-shadow: none;
        }

        #send-btn {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.4) !important;
            color: #222 !important;
            /* 强行改为黑色字体！ */
            font-weight: bold;
            /* 加粗让你看得清清楚楚 */
            border: 1px solid rgba(0, 0, 0, 0.2) !important;
            /* 换成黑框增加识别度 */
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            /* 不可见时不可点 */
        }

        /* 只要有内容，发送按钮就一直保持可见，再也不会神秘消失 */
        #send-btn.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #send-btn:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        /* ==== 历史记录弹窗面板临时样式 ==== */
        #history-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 5000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .history-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            height: 60%;
            padding: 20px;
            color: #333;
            position: relative;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            /* 下面这两行非常关键，开启内部滚动并隐藏外部溢出，历史记录再多也不会滑到外面去 */
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 美化历史记录的滚动条 */
        .history-content::-webkit-scrollbar {
            width: 6px;
        }

        .history-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        #close-history {
            position: sticky;
            top: 0;
            float: right;
            z-index: 10;
            background: #555;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #history-list {
            margin-top: 20px;
            color: #666;
            font-size: 0.95rem;
        }


        /* --- 动画关键帧 --- */

        /* 星星闪烁 - 峰值在50%正中间，保证来回节奏完全一致！ */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50%       { opacity: 1; }
        }

        /* 海浪交错动画，使用 translate3d 开启 GPU 加速避免卡顿 */
        @keyframes waveLeftRight {
            0% {
                transform: translate3d(-1.5%, 0, 0);
            }

            100% {
                transform: translate3d(1.5%, 0, 0);
            }
        }

        @keyframes waveRightLeft {
            0% {
                transform: translate3d(1.5%, 0, 0);
            }

            100% {
                transform: translate3d(-1.5%, 0, 0);
            }
        }



        /* 月亮本身光晕增强 */
        @keyframes moonBreath {
            0% {
                filter: drop-shadow(0 0 5px rgba(255, 255, 220, 0.3));
                opacity: 1;
            }

            100% {
                filter: drop-shadow(0 0 35px rgba(255, 255, 255, 1));
                opacity: 1;
            }
        }

        /* 发送动画特效的简约白色四角星簇粒子 */
        .particle {
            position: absolute;
            color: #ffffff;
            font-size: 26px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.9), 0 0 15px rgba(255, 255, 255, 0.5);
            transition: transform 1.8s cubic-bezier(0.15, 0.8, 0.5, 1), opacity 1.8s ease-in;
        }
    </style>
</head>

<body>

    <!-- 苹果 iOS 专属陀螺仪授权开屏按钮 -->
    <div id="start-overlay">
        <div id="start-btn">点击开启流星星空</div>
    </div>

    <!-- 视角容器 -->
    <div id="scene">
        <!-- 第 1-13 层 Z-index -->
        <img src="sky.png" id="sky" class="layer parallax-layer" alt="天空">

        <img src="star.png" id="star" class="layer parallax-layer" alt="星星">
        <img src="star1.png" id="star1" class="layer parallax-layer" alt="星星1">
        <img src="star2.png" id="star2" class="layer parallax-layer" alt="星星2">
        <img src="star3.png" id="star3" class="layer parallax-layer" alt="星星3">
        <img src="star4.png" id="star4" class="layer parallax-layer" alt="星星4">

        <!-- 将月亮分离为一个接收视差的 wrapper 层，与内部处理转动的 container 层分离，避免 transform 行内样式覆盖丢失动画 -->
        <div id="moon-wrapper" class="layer parallax-layer" style="z-index: 7;">
            <div id="moon-container">
                <img src="moon.png" alt="月亮">
            </div>
        </div>

        <img src="ocean4.png" id="ocean4" class="layer parallax-layer" alt="海浪4">
        <img src="dao.png" id="dao" class="layer parallax-layer" alt="岛屿">
        <img src="ocean3.png" id="ocean3" class="layer parallax-layer" alt="海浪3">
        <img src="ocean2.png" id="ocean2" class="layer parallax-layer" alt="海浪2">
        <img src="ocean1.png" id="ocean1" class="layer parallax-layer" alt="最近海浪">

        <!-- 前景 UI 系列 -->
        <div id="heying-container" class="parallax-layer">
            <img src="heying.png" id="heying" class="layer" alt="常规底背">
            <img src="heying1.png" id="heying1" class="layer" alt="展开时底背">
        </div>
    </div>

    <!-- 最高层级UI层互动 -->
    <div id="ui-layer">
        <!-- 音乐播放器 -->
        <!-- 👇👇 【把你的音乐文件放到同一目录下，改名为 bgm.mp3 即可】 👇👇 -->
        <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
        
        <!-- 音乐控制旋钮 -->
        <div id="music-btn" class="clickable">🎵</div>

        <!-- 历史小按钮 -->
        <button id="history-btn" class="clickable">时光印记</button>

        <!-- 治愈系短语 -->
        <div id="healing-text"></div>

        <!-- 输入区域 -->
        <div id="input-container">
            <textarea id="diary-input" class="clickable" placeholder="摸摸头～腿腿小朋友今天想和我聊些什么呢？"></textarea>
            <button id="send-btn" class="clickable">发向星空</button>
        </div>
    </div>

    <!-- 历史记录展示弹窗 (默认隐藏) -->
    <div id="history-modal" style="display: none;">
        <div class="history-content clickable">
            <button id="close-history">关闭</button>
            <h3 style="margin-top:0;">往期回忆</h3>
            <div id="history-list">
                <p>这里目前空空如也。</p>
                <p>等到接通后端邮箱或数据库后，别人写下的日记都会奇迹般地保存在这里！</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ☁️ 腾讯云开发配置区
        // ============================================================
        const TCB_ENV_ID = "tt-7gr2zm0n95f26df2";
        
        let tcbApp = null;
        let tcbDb = null;
        let isCloudActive = false;

        async function initCloud() {
            try {
                tcbApp = cloudbase.init({ env: TCB_ENV_ID });
                const auth = tcbApp.auth({ persistence: "local" });
                if (!auth.hasLoginState()) {
                    await auth.anonymousAuthProvider().signIn();
                }
                tcbDb = tcbApp.database();
                isCloudActive = true;
                
                // 连通后立刻同步配置
                await syncCloudConfig();
                // 开启侦讯
                initTelemetry();
            } catch (e) { console.error("Cloud init failed:", e); }
        }
        initCloud();

        // 1. 治愈暖心短语系统 (全量云端拉取)
        let phrases = ["加载中，请稍候..."]; // 初始占位，会被云端瞬间覆盖

        const textEl = document.getElementById('healing-text');
        textEl.innerText = phrases[0];
        
        function cycleText() {
            if (phrases.length === 0) return;
            textEl.style.opacity = '0';
            setTimeout(() => {
                const randText = phrases[Math.floor(Math.random() * phrases.length)];
                textEl.innerText = randText;
                textEl.style.opacity = '1';
            }, 1600);
        }

        setInterval(cycleText, 10000); 

        // 🔍 [云端配置同步]：从云端拉取最新的音乐和语录
        async function syncCloudConfig() {
            if (!isCloudActive) return;
            try {
                const res = await tcbDb.collection("AppConfig").limit(1).get();
                if (res.data && res.data.length > 0) {
                    const config = res.data[0];
                    // 同步音乐 (支持直链 & 腾讯云云存储ID)
                    if (config.bgmUrl) {
                        let playUrl = config.bgmUrl;
                        if (playUrl.startsWith("cloud://")) {
                            const resUrl = await tcbApp.getTempFileURL({ fileList: [playUrl] });
                            playUrl = resUrl.fileList[0].tempFileURL;
                        }
                        const bgmEl = document.getElementById('bgm');
                        bgmEl.src = playUrl;
                        bgmEl.load();
                    }
                    // 同步语录：拉取云端全量语录，覆盖本地占位符
                    if (config.phrases && config.phrases.length > 0) {
                        phrases = config.phrases;
                        // 立刻展示第一句云端语录，不要让用户看占位符太久
                        textEl.innerText = phrases[0];
                        textEl.style.opacity = '1';
                    }
                }
            } catch (e) { 
                console.log("Config sync idle.");
                phrases = ["今晚的星空真美。", "愿你有个好梦。"]; // 云端失败后的最终保命兜底
            }
        }

        // 2. 深度动效系统：陀螺仪反向深度视差
        // 核心理念：前景正向跑，海洋/星空/月亮【反向】偏移，用负数权重，产生极强烈的交叉层级裸眼 3D 感应！
        const parallaxConfig = [
            { id: 'heying-container', weight: 1.0 },   // 焦点前景
            { id: 'dao', weight: 0.4 },                // 中岛，跟进小幅度正向

            { id: 'ocean1', weight: -0.1 },            // 注意！从这里开始海浪背景向反方向负位移
            { id: 'ocean2', weight: -0.15 },
            { id: 'input-container', weight: -0.15 },  // 【降维打击】：把文本框的物理视差直接挂载到 ocean2 海洋所在的同一层 3D 物理空间上！
            { id: 'ocean3', weight: -0.2 },
            { id: 'ocean4', weight: -0.25 },
            { id: 'moon-wrapper', weight: -0.3 },      // 月宫深距反向
            { id: 'sky', weight: 0 }                   // 星空幕布深处不动
        ];

        // 👇👇 【星星的陀螺仪幅度调大了】 👇👇：每颗星星赋予固定的差异化权重，数値越大浮动越强烈！
        parallaxConfig.push({ id: 'star',  weight: -0.6 });
        parallaxConfig.push({ id: 'star1', weight: -0.9 });
        parallaxConfig.push({ id: 'star2', weight: -0.5 });
        parallaxConfig.push({ id: 'star3', weight: -0.7 });
        parallaxConfig.push({ id: 'star4', weight: -1.0 });

        // 获取元素DOM引用
        const parallaxElements = parallaxConfig.map(item => ({
            el: document.getElementById(item.id),
            weight: item.weight
        })).filter(o => o.el);

        // 渲染插值，使动画极其平滑
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        const maxOffsetPx = 25; // weight为1.0时的最大偏移量，调大后高权重星星浮动更强烈

        function updateParallax() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            parallaxElements.forEach(item => {
                const x = currentX * maxOffsetPx * item.weight;
                const y = currentY * maxOffsetPx * item.weight;

                // 因为 input-container 本身是用 translateX(-50%) 来实现居中的，所以陀螺仪更新时必须携带并保留它！
                if (item.el.id === 'input-container') {
                    item.el.style.transform = `translateX(-50%) translate3d(${x}px, ${y}px, 0)`;
                } else {
                    item.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                }
            });

            requestAnimationFrame(updateParallax);
        }
        requestAnimationFrame(updateParallax);

        // ============================================================
        // 月亮轨道引擎（JavaScript 精确驱动，彻底告别 CSS 插值延迟！）
        // ============================================================
        const moonContainer = document.getElementById('moon-container');
        const MOON_CROSS_MS   = 4.5 * 60 * 1000;  // 可见过天空时间：4.5 分钟
        const MOON_HIDDEN_MS  = 30 * 1000;          // 落山后等待时间：30 秒
        const MOON_FADE_MS    = 8 * 1000;            // 升起/落下淡入淡出动画时长：8 秒（更干脆利落）
        const ROT_START       = -45;                 // 旋转起点（之前是-80，月亮大部分时间藏在地平线下！缩小到-45让它一直挂在天上）
        const ROT_END         =  45;                 // 旋转终点（同理缩小，月亮落山不再钻到地底下去）
        let moonPhaseStart    = performance.now();   // 当前阶段的开始时间戳
        let moonPhase         = 'crossing';          // 初始状态：直接从过天空开始，让用户一进来就看到月亮

        function tickMoon(now) {
            const elapsed = now - moonPhaseStart;

            if (moonPhase === 'crossing') {
                // 阶段1：月亮横跨天空
                const t = Math.min(elapsed / MOON_CROSS_MS, 1);
                const rot = ROT_START + (ROT_END - ROT_START) * t;
                // 头尾各用 MOON_FADE_MS 做淡入淡出
                const fadeRatio = MOON_FADE_MS / MOON_CROSS_MS;
                let opacity = 1;
                if (t < fadeRatio)       opacity = t / fadeRatio;
                else if (t > 1 - fadeRatio) opacity = (1 - t) / fadeRatio;
                moonContainer.style.transform = `rotate(${rot}deg) translateZ(0)`;
                moonContainer.style.opacity   = opacity;

                if (elapsed >= MOON_CROSS_MS) {
                    // 切换到隐藏等待阶段
                    moonContainer.style.opacity = '0';
                    // 瞬间复位到左侧（此时透明，用户看不到跳位！）
                    moonContainer.style.transform = `rotate(${ROT_START}deg) translateZ(0)`;
                    moonPhaseStart = now;
                    moonPhase = 'hidden';
                }
            } else {
                // 阶段2：隐藏等待。时间到了直接切回 crossing，无任何过渡
                if (elapsed >= MOON_HIDDEN_MS) {
                    moonPhaseStart = now;
                    moonPhase = 'crossing';
                }
            }

            requestAnimationFrame(tickMoon);
        }
        requestAnimationFrame(tickMoon);

        // 苹果 iOS 13+ 终极对策：必须由用户屏幕点击才能获取陀螺仪！
        const startOverlay = document.getElementById('start-overlay');
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('music-btn');
        let isMusicPlaying = false;

        // 音乐手动开关逻辑
        musicBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgm.pause();
                musicBtn.classList.remove('playing');
            } else {
                bgm.play();
                musicBtn.classList.add('playing');
            }
            isMusicPlaying = !isMusicPlaying;
        });

        // ============================================================
        // 📡 侦查雷达：用户数据追踪系统
        // ============================================================
        let sessionStartTime = Date.now();
        let telemetryDocId = null;

        async function initTelemetry() {
            if (!isCloudActive) return;
            try {
                // 1. 获取动态 IP 和 城市 (多重安全检查，防止变量未加载)
                let ip = "未知";
                let cityName = "正在侦搜中...";

                // 强制等待 500ms 确保 sohu 脚本已经执行过并挂载了变量
                if (typeof returnCitySN === 'undefined') {
                    await new Promise(r => setTimeout(r, 600));
                }

                if (typeof returnCitySN !== 'undefined') {
                    ip = returnCitySN["cip"] || "未知";
                    cityName = returnCitySN["cname"] || "国内";
                }
                
                // 2. 存入云端
                const res = await tcbDb.collection("UserTelemetry").add({
                    ip: ip,
                    cityName: cityName,
                    createTime: tcbDb.serverDate(),
                    durationSec: 0,
                    diaryInput: "-"
                });
                telemetryDocId = res.id;
                console.log("📡 已捕获访客行踪:", cityName);
            } catch (e) { console.error("Telemetry report failed:", e); }
        }

        // 离场时回传停留时长
        window.addEventListener('pagehide', () => {
            if (isCloudActive && telemetryDocId) {
                const duration = Math.round((Date.now() - sessionStartTime) / 1000);
                tcbDb.collection("UserTelemetry").doc(telemetryDocId).update({
                    durationSec: duration
                });
            }
        });

        startOverlay.addEventListener('click', () => {
            // 消失遮罩
            startOverlay.style.opacity = '0';
            setTimeout(() => startOverlay.remove(), 800);

            // 【触发音乐播放】：必须在这里触发，因为现代手机浏览器严禁没有用户点击过的网页自动发声
            bgm.play().then(() => {
                isMusicPlaying = true;
                musicBtn.classList.add('playing');
            }).catch(() => {
                // 如果找不到文件或由于某些奇葩原因被阻止，不影响主要流程
                console.log("Music play failed or bgm.mp3 not found.");
            });

            // 请求浏览器全屏显示 (安卓/桌面极速生效，彻底隐藏恶心的下方导航栏)
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) { docEl.requestFullscreen().catch(() => { }); }
            else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen(); }

            // 请求陀螺仪权限 (iOS 13+ 专用)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert("已拒接开启陀螺仪，只能滑动体验视差啦");
                        }
                    })
                    .catch(console.error);
            } else {
                // 安卓或旧设备直接挂载
                window.addEventListener('deviceorientation', handleOrientation);
            }
        });

        // 抽离出来的陀螺仪解析函数
        function handleOrientation(e) {
            // 核心修复机制：强制类型约束！旧版安卓极易在此处吐出 null 或者 undefined 导致衍生出 NaN（无效数字）
            // 一旦物理引擎接到 NaN，所有的图片贴图都会瞬间崩溃导致狂闪和黑屏！
            if (typeof e.beta === 'number' && typeof e.gamma === 'number') {
                let x = Math.max(-1, Math.min(1, e.gamma / 45));
                let y = Math.max(-1, Math.min(1, -(e.beta - 45) / 45));

                // 终极安全锁，确信数字绝对安全后才注入渲染引擎
                if (!isNaN(x) && !isNaN(y)) {
                    targetX = x;
                    targetY = y;
                }
            }
        }

        // 为兼容桌面调试，同时加上鼠标移动监听。
        // 修正为 pointermove 且排除了手指触摸事件，避免手机屏幕点击导致画面异常跳闪
        window.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'mouse') return; // 手机端不再受手指点击干扰
            let x = (e.clientX / window.innerWidth) * 2 - 1;
            let y = (e.clientY / window.innerHeight) * 2 - 1;
            targetX = x;
            targetY = y;
        });


        // 3. UI 交互逻辑：不可摧毁的防错状态逻辑
        const inputContainer = document.getElementById('input-container');
        const diaryInput = document.getElementById('diary-input');
        const sendBtn = document.getElementById('send-btn');
        const heying = document.getElementById('heying');
        const heying1 = document.getElementById('heying1');

        let editingRecordIndex = -1; // 用于记录当前正在编辑的历史条目索引

        function updateUIState() {
            const hasText = diaryInput.value.trim().length > 0;
            const isFocused = document.activeElement === diaryInput;

            // 只要有文字或者正在输入，就保持全面展开状态！防止收起键盘后画面割裂！
            if (hasText || isFocused) {
                inputContainer.classList.add('expanded');
                heying.style.opacity = '0';
                heying1.style.opacity = '1';
            } else {
                inputContainer.classList.remove('expanded');
                heying.style.opacity = '1';
                heying1.style.opacity = '0';
            }

            // 只要有文字，发送按钮就死死钉在屏幕上，谁也弄不掉
            if (hasText) {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        }

        diaryInput.addEventListener('focus', updateUIState);
        diaryInput.addEventListener('input', updateUIState);
        // 收起键盘时延迟判定，防止苹果手机判断过快
        diaryInput.addEventListener('blur', () => { setTimeout(updateUIState, 150); });

        // 防止 iOS 双击屏幕自动放大画面的终极 JS 锁
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // 4. 发送微型金色星星粒子特效与记录保存
        sendBtn.addEventListener('click', () => {
            if (!diaryInput.value.trim()) return;

            // ================= 新增：区分新建还是修改历史记录 =================
            const diaryText = diaryInput.value.trim();
            const dateStr = new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            let records = JSON.parse(localStorage.getItem('tt-diary-history') || '[]');

            if (editingRecordIndex !== -1) {
                // 如果是编辑模式，则覆写这条日记
                records[editingRecordIndex].text = diaryText;
                records[editingRecordIndex].time = dateStr + ' (已编辑)';

                // 恢复默认发送状态
                editingRecordIndex = -1;
                sendBtn.innerText = '放飞心情';
            } else {
                // 如果是全新日记，插到最前面
                records.unshift({ time: dateStr, text: diaryText });
            }

            // 保存回手机本地
            localStorage.setItem('tt-diary-history', JSON.stringify(records));
            // ==========================================================================

            // 获取输入框的中心顶部坐标作为发射点
            const rect = diaryInput.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top;

            // 发送后清空输入输出回归平静
            diaryInput.value = '';
            diaryInput.blur(); // 触发 blur
            updateUIState(); // 强行人工同步状态！立刻恢复原来的面貌！彻底修复发完信卡住悬空的 BUG

            // 生成漫天繁星的抛物线飞空
            createParticle(startX, startY);

            // [同步心事到云端]
            if (isCloudActive && telemetryDocId) {
                tcbDb.collection("UserTelemetry").doc(telemetryDocId).update({
                    diaryInput: diaryText
                });
            }
        });

        function createParticle(x, y) {
            // 一口气生成十几颗星星爆裂散开！
            const count = 12 + Math.floor(Math.random() * 6);
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                // 使用极简四角白金芒星替代土老冒的 Emoji
                particle.innerHTML = '✦';

                // 给每个星星加上些随机水平偏差和垂直错落，形成不规则的炸裂星簇感
                const offsetX = (Math.random() - 0.5) * 70;
                const offsetY = (Math.random() - 0.5) * 40;

                // 初始位置设定
                particle.style.left = (x + offsetX) + 'px';
                particle.style.top = (y + offsetY) + 'px';

                // 赋给一点随机的大小差异
                const scaleNum = 0.3 + Math.random() * 0.4;
                particle.style.transform = `scale(${scaleNum})`;

                document.getElementById('ui-layer').appendChild(particle);

                // 必须在下一帧应用位移以触发过渡动画
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        // 朝向高空深处散开飞去 (带随机轨道角度)
                        const targetX = (window.innerWidth / 2) - x + (Math.random() - 0.5) * 400;
                        const targetY = -(y - window.innerHeight * 0.1) - Math.random() * 250;

                        particle.style.transform = `translate(${targetX}px, ${targetY}px) scale(${scaleNum - 0.2})`;
                        particle.style.opacity = '0'; // 随之消失
                    });
                });

                // 回收DOM清理垃圾内存
                setTimeout(() => {
                    particle.remove();
                }, 2000);
            }
        }

        // 5. 历史记录弹窗交互与增删改查
        const historyBtn = document.getElementById('history-btn');
        const historyModal = document.getElementById('history-modal');
        const closeHistoryBtn = document.getElementById('close-history');
        const historyList = document.getElementById('history-list');

        function renderHistory() {
            let records = JSON.parse(localStorage.getItem('tt-diary-history') || '[]');

            if (records.length === 0) {
                historyList.innerHTML = '<p style="color:#666; text-align:center; margin-top:30px;">你还没有写下过日记哦。<br>快去放飞今天的第一份心情吧。</p>';
            } else {
                historyList.innerHTML = records.map((r, index) => `
                    <div style="background: rgba(255,255,255,0.6); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.1); text-align: left;">
                        <div style="font-size: 0.8rem; color: #888; margin-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 5px;">
                            ${r.time}
                            <span style="float:right; cursor:pointer; color:#d44; font-weight:bold; padding-left:12px;" onclick="deleteRecord(${index})">删除</span>
                            <span style="float:right; cursor:pointer; color:#44a; font-weight:bold;" onclick="editRecord(${index})">修改</span>
                        </div>
                        <div style="color: #222; font-size: 1.05rem; line-height: 1.5; word-break: break-all; white-space: pre-wrap;">${r.text}</div>
                    </div>
                `).join('');
            }
        }

        // 挂载到 window 确保 onClick 能访问到
        window.deleteRecord = function (index) {
            if (confirm('确定要擦除这条珍贵的记忆吗？')) {
                let records = JSON.parse(localStorage.getItem('tt-diary-history') || '[]');
                records.splice(index, 1); // 剃除该条记录
                localStorage.setItem('tt-diary-history', JSON.stringify(records));
                renderHistory(); // 实时刷新界面
            }
        };

        window.editRecord = function (index) {
            let records = JSON.parse(localStorage.getItem('tt-diary-history') || '[]');

            // 记录正在编辑的日志序号
            editingRecordIndex = index;

            // 将文本回填到主输入框
            diaryInput.value = records[index].text;

            // 立刻关闭历史弹窗
            historyModal.style.display = 'none';
            // 更改按钮为保存状态
            sendBtn.innerText = '保存修改';

            // 自动唤起键盘并展开 heying1 大黑板
            diaryInput.focus();
            updateUIState();
        };

        historyBtn.addEventListener('click', () => {
            renderHistory();
            historyModal.style.display = 'flex';
        });

        closeHistoryBtn.addEventListener('click', () => {
            historyModal.style.display = 'none';
        });

        // 点击外部黑色半透明遮罩也可以极速关闭弹窗
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) {
                historyModal.style.display = 'none';
            }
        });

    </script>
